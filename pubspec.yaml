name: the_ielts_spells_mobile
description: "The IELTS Spells Mobile Companion - Micro-learning & Habit Loop App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Local Storage & Database
  shared_preferences: ^2.2.3

  # Audio, Recording & Waveforms
  audioplayers: ^6.0.0
  record: ^5.1.2

  # Animations & UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
